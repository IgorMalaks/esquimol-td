<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Prévia 2.5D — Esquimó TD</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .preview { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: .5rem; padding: .5rem; position: relative; z-index: 1; }
    .pv-bar { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; padding: .5rem .8rem; }
    .pv-bar label { display: inline-flex; gap: .4rem; align-items: center; font-weight: bold; font-size: .9rem; }
    .pv-stage { flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; }
    #c { display: block; box-shadow: 0 0 0 3px #1b1b1b, 0 6px 0 #1b1b1b; border-radius: 12px; touch-action: none; }
    .pv-note { margin: 0; text-align: center; }
  </style>
</head>
<body>
  <div class="preview">
    <header class="pv-bar card">
      <strong>Prévia 2.5D (vista 3/4)</strong>
      <label>Inclinação <input id="tilt" type="range" min="0.45" max="1" step="0.01" value="0.95"> <span id="tiltVal"></span></label>
      <label><input type="checkbox" id="range" checked> Mostrar alcance</label>
      <button class="btn btn-small" id="pause">Pausar</button>
      <a class="btn btn-small" href="../index.html">Voltar ao jogo</a>
    </header>
    <div class="pv-stage"><canvas id="c" aria-label="Prévia da arena em 2.5D"></canvas></div>
    <p class="hint pv-note">Só visual: mesma lógica de mundo 1000×600 do jogo, projetada em perspectiva 3/4. Rostos vêm do mesmo criador do admin.</p>
  </div>
  <script type="module" src="25d.js"></script>
</body>
</html>
